# Desktop app (apps/desktop): builds the installers for a tag `desktop-v<version>` and collects them in a DRAFT release.
# Publishing the draft is a person's step; the update feed on squorli.com follows separately (squorli-website,
# `pnpm desktop:release`), which is the rollout switch. Server images use tags `v*` (ci.yml); the two never overlap.
#
# Signed builds (4 October 2026, docs/features/desktop.md "Code signing"): the build job runs in the GitHub environment
# `signing`, which only the repository owner may approve and which alone holds the secrets:
#   CERTUM_EMAIL, CERTUM_OTP      the SimplySign login of Certum's cloud code-signing certificate; ssign signs the Windows
#                                 executables with it (apps/desktop/build/sign.cjs)
#   GPG_PRIVATE_KEY, GPG_PASSPHRASE  the key "Squorli Desktop Releases <signing@squorli.com>" for the detached signatures of the
#                                 Linux files (public half: https://squorli.com/squorli-desktop.asc)
# A tag build fails when it cannot sign; a test build without the secrets is built unsigned.
# Details: docs/features/desktop.md, apps/desktop/AGENTS.md.
name: Desktop release

on:
  push:
    tags: ["desktop-v*"]
  # By hand: with a tag = build and release that existing tag; without = a test build of the chosen branch (artifacts only,
  # no release), to try the workflow without spending a version.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and release (desktop-v<version>); empty = test build of the chosen branch, no release
        required: false

permissions:
  contents: read

env:
  # Empty for a test build.
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || (github.ref_type == 'tag' && github.ref_name || '') }}
  # The signing client, built from its reviewed source on crates.io at this exact version (apps/desktop/AGENTS.md).
  SSIGN_VERSION: 0.1.7

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    # Holds the signing secrets and waits for the owner's approval (Settings > Environments > signing > Required reviewers).
    environment: signing
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.TAG || github.ref }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - name: Tag must match the app's version
        if: env.TAG != ''
        shell: bash
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          if [ "desktop-v$version" != "$TAG" ]; then echo "tag $TAG does not match apps/desktop/package.json ($version)"; exit 1; fi
      - run: pnpm install --frozen-lockfile
      # Electron's binary is not needed for packaging (electron-builder downloads its own copy), but harmless.
      # `pnpm run`, not `pnpm licenses`: pnpm has a built-in command of that name, which hides the script.
      - run: pnpm run icons
      - run: pnpm run licenses
      - run: pnpm --filter "@squorli/desktop..." build
      # Windows: the native audio capture helper (MSVC is part of the runner image); a no-op elsewhere.
      - run: pnpm --filter @squorli/desktop native
      # Windows: ssign (the runner image has Rust); kept between runs by version.
      - name: ssign from the cache
        if: runner.os == 'Windows'
        id: ssign
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/ssign.exe
          key: ssign-${{ env.SSIGN_VERSION }}-${{ runner.os }}
      - name: Build ssign
        if: runner.os == 'Windows' && steps.ssign.outputs.cache-hit != 'true'
        run: cargo install ssign --version ${{ env.SSIGN_VERSION }} --locked
      - run: pnpm --filter @squorli/desktop dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          CERTUM_EMAIL: ${{ secrets.CERTUM_EMAIL }}
          CERTUM_OTP: ${{ secrets.CERTUM_OTP }}
          SQUORLI_SIGN_REQUIRED: ${{ env.TAG != '' && '1' || '0' }}
      # Every Windows executable of a release carries a valid signature; the subject is printed (it is the publisherName).
      - name: Check the Windows signatures
        if: runner.os == 'Windows' && env.TAG != ''
        shell: pwsh
        run: |
          $files = @(Get-ChildItem apps/desktop/release/*.exe) + @(Get-Item apps/desktop/release/win-unpacked/Squorli.exe) + @(Get-ChildItem apps/desktop/release/win-unpacked/resources/native/*.exe -ErrorAction SilentlyContinue)
          foreach ($f in $files) {
            $s = Get-AuthenticodeSignature $f.FullName
            Write-Host ("{0}: {1} / {2}" -f $f.Name, $s.Status, $s.SignerCertificate.Subject)
            if ($s.Status -ne 'Valid') { throw "$($f.Name) is not validly signed ($($s.Status))" }
          }
      # Linux: detached GPG signatures next to the AppImage and the deb.
      - name: Sign the Linux files
        if: runner.os == 'Linux'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            if [ -n "$TAG" ]; then echo "GPG_PRIVATE_KEY is not set: refusing to release unsigned Linux files"; exit 1; fi
            echo "no GPG key in the environment: test build, Linux files stay unsigned"; exit 0
          fi
          export GNUPGHOME=$(mktemp -d)
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --quiet --import
          for f in apps/desktop/release/*.AppImage apps/desktop/release/*.deb; do
            printf '%s\n' "$GPG_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --armor --detach-sign --output "$f.asc" "$f"
            gpg --verify "$f.asc" "$f"
          done
          rm -rf "$GNUPGHOME"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-${{ matrix.os }}
          if-no-files-found: error
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.exe.blockmap
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.asc
            apps/desktop/release/latest*.yml

  release:
    needs: build
    if: github.ref_type == 'tag' || inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The version's release notes (apps/desktop/release-notes/<version>.md, written with the `desktop-release` skill before
      # the tag is set). Checked out BEFORE the artifacts arrive: a checkout empties the folder it works in.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.TAG }}
          sparse-checkout: apps/desktop/release-notes
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
          merge-multiple: true
      - name: Draft release with all files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la artifacts
          notes="apps/desktop/release-notes/${TAG#desktop-v}.md"
          footer="Installers for Windows (Squorli-Setup-*.exe) and Linux (AppImage, deb). The Windows files are code-signed with a Certum certificate issued to Daniel Klessa (Open Source Developer); Windows SmartScreen may still warn while the certificate is new. The Linux files come with detached GPG signatures (*.asc) by the key \"Squorli Desktop Releases\" E62D 34CB F884 0496 931F B534 580D 3789 5466 FC24, published at https://squorli.com/squorli-desktop.asc. Download page: https://squorli.com/en/download/"
          # A version without a notes file gets the standing text alone, as every release did before.
          if [ -f "$notes" ]; then { cat "$notes"; echo; echo "---"; echo; echo "$footer"; } > body.md; else echo "$footer" > body.md; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --clobber
            # A run repeated for the same tag also brings the notes up to date, but never rewrites a release a person has published.
            if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = "true" ]; then gh release edit "$TAG" --notes-file body.md; fi
          else
            gh release create "$TAG" artifacts/* --draft --verify-tag --title "Squorli Desktop ${TAG#desktop-v}" --notes-file body.md
          fi
