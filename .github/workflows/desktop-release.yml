# Desktop app (apps/desktop): builds the installers for a tag `desktop-v<version>` and collects them in a DRAFT release.
# Publishing the draft is a person's step; the update feed on squorli.com follows separately (squorli-website,
# `pnpm desktop:release`), which is the rollout switch. Server images use tags `v*` (ci.yml); the two never overlap.
# Unsigned builds. Details: docs/features/desktop.md, apps/desktop/AGENTS.md.
name: Desktop release

on:
  push:
    tags: ["desktop-v*"]
  # By hand: with a tag = build and release that existing tag; without = a test build of the chosen branch (artifacts only,
  # no release), to try the workflow without spending a version.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and release (desktop-v<version>); empty = test build of the chosen branch, no release
        required: false

permissions:
  contents: read

env:
  # Empty for a test build.
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || (github.ref_type == 'tag' && github.ref_name || '') }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG || github.ref }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Tag must match the app's version
        if: env.TAG != ''
        shell: bash
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          if [ "desktop-v$version" != "$TAG" ]; then echo "tag $TAG does not match apps/desktop/package.json ($version)"; exit 1; fi
      - run: pnpm install --frozen-lockfile
      # Electron's binary is not needed for packaging (electron-builder downloads its own copy), but harmless.
      # `pnpm run`, not `pnpm licenses`: pnpm has a built-in command of that name, which hides the script.
      - run: pnpm run icons
      - run: pnpm run licenses
      - run: pnpm --filter "@squorli/desktop..." build
      # Windows: the native audio capture helper (MSVC is part of the runner image); a no-op elsewhere.
      - run: pnpm --filter @squorli/desktop native
      - run: pnpm --filter @squorli/desktop dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.os }}
          if-no-files-found: error
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.exe.blockmap
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/latest*.yml

  release:
    needs: build
    if: github.ref_type == 'tag' || inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The version's release notes (apps/desktop/release-notes/<version>.md, written with the `desktop-release` skill before
      # the tag is set). Checked out BEFORE the artifacts arrive: a checkout empties the folder it works in.
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          sparse-checkout: apps/desktop/release-notes
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Draft release with all files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la artifacts
          notes="apps/desktop/release-notes/${TAG#desktop-v}.md"
          footer="Installers for Windows (Squorli-Setup-*.exe) and Linux (AppImage, deb). Unsigned: Windows SmartScreen warns on the first start. Download page: https://squorli.com/en/download/"
          # A version without a notes file gets the standing text alone, as every release did before.
          if [ -f "$notes" ]; then { cat "$notes"; echo; echo "---"; echo; echo "$footer"; } > body.md; else echo "$footer" > body.md; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --clobber
            # A run repeated for the same tag also brings the notes up to date, but never rewrites a release a person has published.
            if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = "true" ]; then gh release edit "$TAG" --notes-file body.md; fi
          else
            gh release create "$TAG" artifacts/* --draft --verify-tag --title "Squorli Desktop ${TAG#desktop-v}" --notes-file body.md
          fi
