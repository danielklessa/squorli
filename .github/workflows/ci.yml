# test:  typecheck + vitest + build on every push and pull request
# image: production image (Dockerfile, target "app") into the GitHub Container Registry
#        on the default branch (tags <branch>, sha-<short-sha>, latest) and on git tags (<tag>, latest).
#        Use it on the servers via APP_IMAGE in .env, see deploy/compose.yml.
# proxies: the reference proxy configurations against the real stack (GitHub only).
# Mirrors .gitlab-ci.yml (test, image); keep both in step.

name: CI

on:
  push:
    branches: ["**"]
    tags: ["*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # apps/desktop is typechecked, tested and bundled here, never started: no Electron binary.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # The reference proxy configurations (deploy/proxies/) against the real stack: nginx, Traefik and Caddy in front of the
  # production compose.yml, checked through the proxy (docs/features/proxy-tests.md). GitHub only: the GitLab runner's
  # docker-in-docker has no socket for Traefik's docker provider.
  proxies:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: bash deploy/proxies/test/run.sh nginx traefik caddy

  image:
    needs: test
    # Server images: the default branch and tags `v*`. Tags `desktop-v*` belong to the desktop app (desktop-release.yml).
    if: github.event_name == 'push' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: app
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
