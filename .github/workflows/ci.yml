# test:  typecheck + vitest + build on every push and pull request
# image: production image (Dockerfile, target "app") into the GitHub Container Registry
#        on the default branch (tags <branch>, sha-<short-sha>, latest) and on git tags (<tag>, latest), with GitHub's
#        build provenance attestation. The signature of a release's image is made by server-release.yml.
#        Use it on the servers via APP_IMAGE in .env (stable or a version), see deploy/compose.yml.
# windows: typecheck + vitest + server and web build on Windows, then the package for Windows (deploy/windows/), its
#        acceptance test and the package as an artifact of the run (windows-package.yml; GitHub only).
# proxies: the reference proxy configurations against the real stack (GitHub only).
# Mirrors .gitlab-ci.yml (test, image); keep both in step.

name: CI

on:
  push:
    branches: ["**"]
    tags: ["*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # apps/desktop is typechecked, tested and bundled here, never started: no Electron binary.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The package for Windows pins the versions the Compose files and .nvmrc name (deploy/windows/AGENTS.md).
      - run: node deploy/windows/check-versions.mjs
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # Known vulnerabilities in the production dependencies (`pnpm audit --prod`; security audit of 2 October 2026, S15). Shown in
  # the run, never blocking: an advisory that appears tomorrow must not stop a release made today. A red job means: read its
  # log and update the package (docs/DEVELOPMENT.md, "Dependencies").
  audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm audit --prod --audit-level=moderate

  # The server also runs on Windows without Docker (docs/features/windows.md): typecheck, tests and builds on Windows,
  # the package and its acceptance test (windows-package.yml). Not for tags: a tag v* runs the same through
  # server-release.yml, which attaches the package to the release, and the commit was tested when its branch was pushed.
  windows:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    uses: ./.github/workflows/windows-package.yml

  # The reference proxy configurations (deploy/proxies/) against the real stack: nginx, Traefik and Caddy in front of the
  # production compose.yml, checked through the proxy (docs/features/proxy-tests.md). GitHub only: the GitLab runner's
  # docker-in-docker has no socket for Traefik's docker provider.
  proxies:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: bash deploy/proxies/test/run.sh nginx traefik caddy

  image:
    needs: test
    # Server images: the default branch and tags `v*`. Tags `desktop-v*` belong to the desktop app (desktop-release.yml).
    if: github.event_name == 'push' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Build provenance (below)
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          # The image keeps its name although the repository is `squorli` since 1 October 2026: every installation pulls
          # `squorli-server:stable`, and GHCR does not redirect. Same name in server-release.yml and stable-image.yml.
          images: ghcr.io/danielklessa/squorli-server
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: app
          push: true
          # Buildx' own provenance would turn the image into an index around manifest and attestation; stable-image.yml
          # and the installations count on one manifest with one digest. The provenance comes from GitHub instead (below).
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Build provenance (security audit S9, deploy/AGENTS.md "Signed releases"): which workflow built this digest from which
      # commit, as a Sigstore attestation kept by GitHub and pushed next to the image. Anyone checks it with
      # `gh attestation verify oci://ghcr.io/danielklessa/squorli-server:<tag> --owner danielklessa`. The signature that
      # installations check is another thing: server-release.yml signs a release's image after the owner's approval.
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/danielklessa/squorli-server
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
