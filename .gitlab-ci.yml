# test:  typecheck + vitest + build on every push and merge request
# audit: known vulnerabilities in the production dependencies (pnpm audit --prod) on every push, merge request and tag;
#        a critical advisory fails the job and with it the build stage, so no image is built with one.
# build: production image (Dockerfile, target "app") into the project registry on the default branch
#        (tags <branch-slug>, <short-sha>, latest) and on git tags (<tag>, latest).
#        Use it on the servers via APP_IMAGE in .env, see deploy/compose.yml.
# Modelled on ../squorli-directory/.gitlab-ci.yml; keep both in step.

stages:
  - test
  - build

variables:
  # The build jobs talk to the docker:dind service over TLS (5 October 2026, security audit L-11): the service makes a
  # certificate pair under /certs and the client reads it from /certs/client, which the runner must mount into both
  # containers (config.toml of the runner: `volumes = ["/certs/client", "/cache"]`); until then the daemon listened on a
  # plain port 2375 of the job's network. The registry password goes to `docker login` over stdin, never on a command line.
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_HOST: tcp://docker:2376
  DOCKER_TLS_VERIFY: "1"
  DOCKER_CERT_PATH: /certs/client
  IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG
  IMAGE_TAG_SHA: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA

test:
  stage: test
  # A newer push to the same branch cancels a run that is still waiting or running (Renovate pushes often, and there is one runner).
  interruptible: true
  image: node:24-alpine@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1
  variables:
    PNPM_HOME: $CI_PROJECT_DIR/.pnpm
    # apps/desktop is typechecked, tested and bundled here, never started: no Electron binary.
    ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
  cache:
    key: pnpm-$CI_COMMIT_REF_SLUG
    paths:
      - .pnpm-store
  before_script:
    - corepack enable
    - pnpm config set store-dir $CI_PROJECT_DIR/.pnpm-store
    - pnpm install --frozen-lockfile
  script:
    # The package for Windows pins the versions the Compose files and .nvmrc name (deploy/windows/AGENTS.md).
    - node deploy/windows/check-versions.mjs
    - pnpm typecheck
    - pnpm test
    - pnpm build
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

# Known vulnerabilities in the production dependencies (security audit of 2 October 2026, S15; blocking since 5 October 2026,
# recommendation 13 of that day's audit). The first command shows everything from moderate up and never fails the job; the
# second fails it on a critical advisory, and with it the build stage (`build`, `build-tag`): no image of a branch or a
# release is built with a critical advisory in what it ships. From moderate to high: read the log, update the package. A
# critical advisory without a fix that does not reach the code paths here is excepted in package.json (`pnpm.auditConfig`,
# the reason in the commit message, removed when the fix comes), never by loosening this job (docs/DEVELOPMENT.md,
# "Dependencies").
audit:
  stage: test
  interruptible: true
  image: node:24-alpine@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1
  before_script:
    - corepack enable
  script:
    - pnpm audit --prod --audit-level=moderate || true
    - pnpm audit --prod --audit-level=critical
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

build:
  stage: build
  image: docker:29@sha256:7dcdfc4a20246236f558175182ccace1eb15a41bd3eb119dd2284f393498b7c1
  services:
    - docker:29-dind@sha256:7dcdfc4a20246236f558175182ccace1eb15a41bd3eb119dd2284f393498b7c1
  before_script:
    - printf '%s' "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - |
      docker build \
        --target app \
        --cache-from $IMAGE_TAG \
        --provenance=false \
        --tag $IMAGE_TAG \
        --tag $IMAGE_TAG_SHA \
        .
    - docker push $IMAGE_TAG
    - docker push $IMAGE_TAG_SHA
    - docker tag $IMAGE_TAG $CI_REGISTRY_IMAGE:latest
    - docker push $CI_REGISTRY_IMAGE:latest
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

build-tag:
  stage: build
  image: docker:29@sha256:7dcdfc4a20246236f558175182ccace1eb15a41bd3eb119dd2284f393498b7c1
  services:
    - docker:29-dind@sha256:7dcdfc4a20246236f558175182ccace1eb15a41bd3eb119dd2284f393498b7c1
  before_script:
    - printf '%s' "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build --target app --provenance=false --tag $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG --tag $CI_REGISTRY_IMAGE:latest .
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG
    - docker push $CI_REGISTRY_IMAGE:latest
  rules:
    # Server images: tags `v*`. Tags `desktop-v*` belong to the desktop app (built on GitHub, .github/workflows/desktop-release.yml).
    - if: $CI_COMMIT_TAG =~ /^v\d/
