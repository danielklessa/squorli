packages:
  - "apps/*"
  - "packages/*"
# pnpm 10 runs no install scripts unless allowed; Electron (apps/desktop) downloads its binary in one.
# CI jobs and the Docker build that do not start the app set ELECTRON_SKIP_BINARY_DOWNLOAD=1.
onlyBuiltDependencies:
  - electron

# Patched versions of transitive packages (security audit, 2 October 2026; `pnpm audit --prod`): brace-expansion 5.0.12 (under
# @fastify/static > glob > minimatch: denial of service by nested braces) and fast-uri 3.1.8 / 4.1.5 (under fastify's
# validator: host case and mailto header handling). Each override stays inside its major version; remove one when the
# package that needs it asks for the fixed version by itself.
overrides:
  "brace-expansion@>=5.0.0 <5.0.12": "5.0.12"
  "fast-uri@>=3.0.0 <3.1.8": "3.1.8"
  "fast-uri@>=4.0.0 <4.1.5": "4.1.5"
