# Traefik v3 in a container, used together with deploy/proxies/traefik.labels.yml unchanged except for the host rule and
# the certificate: the test serves its own certificate as Traefik's default instead of a Let's Encrypt resolver.
# The network "proxy" is the one the labels overlay expects; run.sh creates it.
services:
  app:
    labels:
      traefik.http.routers.chat.rule: "Host(`chat.test`)"
      traefik.http.routers.chat.tls.certresolver: ""
      traefik.http.routers.chat.tls: "true"
  livekit:
    labels:
      traefik.http.routers.chat-rtc.rule: "Host(`chat.test`) && PathPrefix(`/rtc`)"
      traefik.http.routers.chat-rtc.tls.certresolver: ""
      traefik.http.routers.chat-rtc.tls: "true"
  proxy:
    image: traefik:v3.6
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.file.filename=/etc/traefik/tls.yml
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.websecure.address=:443
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./proxytest/traefik-tls.yml:/etc/traefik/tls.yml:ro
      - ../certs:/certs:ro
    networks:
      proxy: { aliases: [chat.test] }
    profiles: [external]
  client:
    networks: [internal, proxy]
