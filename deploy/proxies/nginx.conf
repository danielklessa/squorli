# nginx as an existing reverse proxy (PROXY_MODE=external). Tested by deploy/proxies/test/run.sh with nginx in a container
# (docs/features/proxy-tests.md); a certificate from certbot on a real host is not part of that test.
#
# Prerequisite: app:3000 and livekit:7880 are reachable for nginx.
#   - nginx on the host:    docker compose --env-file ../.env -f compose.yml -f proxies/nginx.ports.yml --profile external up -d
#                           (publishes both ports only on 127.0.0.1)
#   - nginx in a container: attach nginx to the network "squorli_internal" and below
#                           replace 127.0.0.1:3000 -> app:3000, 127.0.0.1:7880 -> livekit:7880.
#
# Not through nginx: 7881/tcp and 7882/udp (media) must pass directly to the host (firewall).
# Subdomain only, no subpath.

map $http_upgrade $connection_upgrade { default upgrade; "" close; }

# HTTP -> HTTPS
server {
  listen 80;
  listen [::]:80;
  server_name chat.example.org;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name chat.example.org;

  # Certificate as usual, e.g. certbot:
  # ssl_certificate     /etc/letsencrypt/live/chat.example.org/fullchain.pem;
  # ssl_certificate_key /etc/letsencrypt/live/chat.example.org/privkey.pem;

  client_max_body_size 30m;   # >= MAX_UPLOAD_MB (default 25) plus the form data around the file

  # LiveKit signaling (WebSocket under /rtc, validation under /rtc/validate)
  location /rtc {
    proxy_pass http://127.0.0.1:7880;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # App server: API, WebSocket /api/ws, static web client
  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }
}
