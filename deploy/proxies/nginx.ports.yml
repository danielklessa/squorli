# Overlay for a proxy that runs on the host (nginx, Apache, Caddy outside Docker).
# Publishes the app server and LiveKit signaling only on localhost; from outside both stay closed.
# Host ports: APP_PORT (default 3000) and LIVEKIT_HTTP_PORT (default 7880) in .env.
#   docker compose --env-file ../.env -f compose.yml -f proxies/nginx.ports.yml --profile external up -d
services:
  server:
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
  livekit:
    ports:
      - "127.0.0.1:${LIVEKIT_HTTP_PORT:-7880}:7880"
