# Production. Two operating modes via Compose profiles:
#   PROXY_MODE=bundled  -> docker compose --env-file ../.env --profile bundled up -d    (Caddy handles TLS on 443)
#   PROXY_MODE=external -> docker compose --env-file ../.env --profile external up -d   (your proxy, see proxies/README.md)
# --env-file ../.env is mandatory: otherwise the ${...} placeholders here are only filled from deploy/.env (empty).
# Media ports (UDP 7882, TCP 7881; LIVEKIT_UDP_PORT/LIVEKIT_TCP_PORT in .env) go directly to LiveKit in BOTH modes, never
# through an HTTP proxy. LiveKit announces them to the clients itself, so host and container use the same number.
# Image: build locally, or set APP_IMAGE=ghcr.io/danielklessa/squorli-server:latest (GitHub Container Registry).
# For the published image, pull with the selected profile, then up -d --no-build. See README.md.

name: squorli

# Container logs (docs/features/logging.md): Docker keeps them unrotated by default. Here at most 3 files of 10 MB per
# container, so old lines (the few with IP addresses included) disappear by themselves. For a time limit instead
# (e.g. 14 days) use journald, see the note.
x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  server:
    build: { context: .., dockerfile: Dockerfile, target: app }
    image: ${APP_IMAGE:-squorli/app:local}
    restart: unless-stopped
    logging: *logging
    env_file: ../.env
    environment:
      DATABASE_URL: postgres://chat:${POSTGRES_PASSWORD}@postgres:5432/chat
      LIVEKIT_URL: http://livekit:7880
      DATA_DIR: /app/data
      # Directory service (M6): separate repo squorli-directory, runs on its own host, e.g. https://id.example.org. Empty = no directory.
      DIRECTORY_URL: ${DIRECTORY_URL:-}
      DIRECTORY_PROOF_URL: ${DIRECTORY_PROOF_URL:-}
      # Server accounts (~name): true/false fixes the admin panel's switch; empty = the admin panel decides. Always on without a directory.
      LOCAL_ACCOUNTS: ${LOCAL_ACCOUNTS:-}
      RATE_LIMIT_FACTOR: ${RATE_LIMIT_FACTOR:-1}
      # The media ports, so the setup check (Verwaltung > Server, `squorli doctor`) can name and probe them; LiveKit gets the same values below.
      LIVEKIT_TCP_PORT: ${LIVEKIT_TCP_PORT:-7881}
      LIVEKIT_UDP_PORT: ${LIVEKIT_UDP_PORT:-7882}
    volumes: [appdata:/app/data]   # attachments, pictures of link previews
    depends_on:
      postgres: { condition: service_healthy }
    networks:
      # Named app until 28 September 2026: a proxy that points to app:3000 keeps reaching it under that name.
      internal: { aliases: [app] }
    profiles: [bundled, external]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: chat
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat -d chat"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]
    profiles: [bundled, external]

  livekit:
    image: livekit/livekit-server:v1.13.7  # pinned; raise it on purpose with a server release (deploy/AGENTS.md)
    restart: unless-stopped
    logging: *logging
    command: --config /etc/livekit.yaml --rtc.tcp_port ${LIVEKIT_TCP_PORT:-7881} --udp-port ${LIVEKIT_UDP_PORT:-7882}
    environment:
      # Keys via env so they are not in the YAML (format "key: secret").
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
      LIVEKIT_NODE_IP: ${LIVEKIT_NODE_IP:-}
    volumes: [./livekit/livekit.yaml:/etc/livekit.yaml:ro]
    ports:
      - "${LIVEKIT_TCP_PORT:-7881}:${LIVEKIT_TCP_PORT:-7881}/tcp"   # media fallback via TCP
      - "${LIVEKIT_UDP_PORT:-7882}:${LIVEKIT_UDP_PORT:-7882}/udp"   # media via UDP (single-port mux)
    networks: [internal]
    profiles: [bundled, external]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *logging
    env_file: ../.env
    ports: ["80:80", "443:443"]
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    networks: [internal]
    profiles: [bundled]

volumes:
  pgdata:
  appdata:
  caddydata:

networks:
  internal:
