# LiveKit configuration for a single node.
# Keys come from the environment variable LIVEKIT_KEYS (see compose.yml).
port: 7880
rtc:
  tcp_port: 7881
  udp_port: 7882          # a single UDP port instead of a range
  use_external_ip: true   # determine the public IP automatically; can be overridden via LIVEKIT_NODE_IP
# TURN (deploy/AGENTS.md, "TURN"): for users behind restrictive firewalls. Needs a TLS certificate for PUBLIC_DOMAIN
# (Caddy does not share its own automatically). Therefore off by default; to enable:
#   1. Mount certificate + key as a volume into the livekit container (e.g. /certs/fullchain.pem, /certs/privkey.pem)
#   2. Uncomment the block below, enter the domain, publish port 5349/tcp for livekit in compose.yml
#   3. Firewall: open 5349/tcp (in addition to 7881/tcp and 7882/udp)
# Status: untested, part of the NAT test with two networks (M1 acceptance).
turn:
  enabled: false
#  domain: chat.example.org
#  tls_port: 5349
#  cert_file: /certs/fullchain.pem
#  key_file: /certs/privkey.pem
# Report the server's speaker detection faster (default 400 ms, 2 smoothing intervals). The client measures levels
# itself and uses these reports only as a fallback when its audio context is blocked.
audio:
  update_interval: 150
  smooth_intervals: 1
# warn, not info: at info LiveKit logs every participant who joins with all the IP addresses of their device (ICE
# candidates). For troubleshooting a connection set info for a while and restart livekit (docs/features/logging.md).
logging:
  level: warn
