# Settings of the Squorli installation. install.ps1 copies this file into the cluster's folder, fills the {{...}} places
# and adds "include = 'postgresql.squorli.conf'" at the end of postgresql.conf, so these values win.
listen_addresses = '127.0.0.1'          # this machine only
port = {{POSTGRES_PORT}}
password_encryption = scram-sha-256

# Logs next to those of the other services: one file per weekday, overwritten a week later. No connection log.
logging_collector = on
log_directory = '{{DATA_DIR_SLASHES}}/logs'
log_filename = 'SquorliPostgres-%a.log'
log_truncate_on_rotation = on
log_rotation_age = 1d
log_rotation_size = 0
