# Portainer stack (web editor or git): chat server + Postgres + LiveKit, external mode (your reverse proxy terminates TLS).
# Self-contained on purpose: no env_file, no build, no bind mounts, no profiles (Portainer cannot provide any of them from
# the web editor). LiveKit gets its config via LIVEKIT_CONFIG instead of deploy/livekit/livekit.yaml (keep both in step).
# Enter the ${...} variables under "Environment variables" of the stack (see README.md "Portainer"):
#   required: PUBLIC_DOMAIN, POSTGRES_PASSWORD, LIVEKIT_API_KEY, LIVEKIT_API_SECRET (32+ characters)
#   usually:  LIVEKIT_NODE_IP (public IP of this host), DIRECTORY_URL, TRUSTED_PROXIES (IP of the proxy), PROXY_BIND_IP
#   optional: APP_IMAGE, SERVER_NAME, OWNER_PUBLIC_KEY, MAX_UPLOAD_MB, LINK_PREVIEWS (true/false), LIVEKIT_PUBLIC_URL, DIRECTORY_PROOF_URL, LOCAL_ACCOUNTS (true/false), RATE_LIMIT_FACTOR, LOG_LEVEL, LOG_REQUESTS (true/false)
# The image defaults to the public one in the GitHub Container Registry; APP_IMAGE pins a version (e.g. :v0.5.0) or another
# registry. See the Portainer section in README.md.
# Firewall: 7881/tcp + 7882/udp open to the world (media); 3000 + 7880 only for the proxy host (HTTP, no TLS).

# Container logs at most 3 files of 10 MB per container (docs/features/logging.md); Docker keeps them unrotated otherwise.
x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  app:
    image: ${APP_IMAGE:-ghcr.io/danielklessa/squorli-server:latest}
    restart: unless-stopped
    logging: *logging
    environment:
      NODE_ENV: production
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN}
      PROXY_MODE: external
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.16.0.0/12,10.0.0.0/8,192.168.0.0/16,127.0.0.1}
      DATABASE_URL: postgres://chat:${POSTGRES_PASSWORD}@postgres:5432/chat
      LIVEKIT_URL: http://livekit:7880
      LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      DATA_DIR: /app/data
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
      LINK_PREVIEWS: ${LINK_PREVIEWS:-true}
      SERVER_NAME: ${SERVER_NAME:-Community}
      OWNER_PUBLIC_KEY: ${OWNER_PUBLIC_KEY:-}
      DIRECTORY_URL: ${DIRECTORY_URL:-}
      DIRECTORY_PROOF_URL: ${DIRECTORY_PROOF_URL:-}
      LOCAL_ACCOUNTS: ${LOCAL_ACCOUNTS:-}
      RATE_LIMIT_FACTOR: ${RATE_LIMIT_FACTOR:-1}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_REQUESTS: ${LOG_REQUESTS:-false}
    volumes: [appdata:/app/data]   # attachments, server icon
    ports:
      - "${PROXY_BIND_IP:-0.0.0.0}:${APP_PORT:-3000}:3000"   # proxy: https://PUBLIC_DOMAIN -> http://<host>:3000 (with WebSocket)
    depends_on:
      postgres: { condition: service_healthy }
    networks: [internal]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: chat
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat -d chat"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  livekit:
    image: livekit/livekit-server:v1.13.7  # pinned; raise it on purpose with a server release (deploy/AGENTS.md)
    restart: unless-stopped
    logging: *logging
    # Media ports from the stack variables; the flags override tcp_port/udp_port of LIVEKIT_CONFIG below.
    command: --rtc.tcp_port ${LIVEKIT_TCP_PORT:-7881} --udp-port ${LIVEKIT_UDP_PORT:-7882}
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
      LIVEKIT_NODE_IP: ${LIVEKIT_NODE_IP:-}
      # Same content as deploy/livekit/livekit.yaml (TURN off).
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          tcp_port: 7881
          udp_port: 7882
          use_external_ip: true
        turn:
          enabled: false
        audio:
          update_interval: 150
          smooth_intervals: 1
        logging:
          level: warn
    ports:
      - "${PROXY_BIND_IP:-0.0.0.0}:${LIVEKIT_HTTP_PORT:-7880}:7880"   # signaling: proxy https://PUBLIC_DOMAIN/rtc* -> http://<host>:7880 (WebSocket)
      - "${LIVEKIT_TCP_PORT:-7881}:${LIVEKIT_TCP_PORT:-7881}/tcp"   # media fallback via TCP
      - "${LIVEKIT_UDP_PORT:-7882}:${LIVEKIT_UDP_PORT:-7882}/udp"   # media via UDP
    networks: [internal]

volumes:
  pgdata:
  appdata:

networks:
  internal:
