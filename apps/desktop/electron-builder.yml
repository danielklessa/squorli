# Packaging of the desktop app (docs/features/desktop.md, apps/desktop/AGENTS.md). Run through `pnpm --filter @squorli/desktop dist`
# after `pnpm build` (root): the app ships the web client's build as `resources/renderer`. Windows (NSIS, signed), Linux
# (AppImage, deb) and, since 21 October 2026, macOS (dmg + zip for arm64 and x64, UNSIGNED: no Apple Developer account yet).
appId: com.squorli.desktop
productName: Squorli
copyright: Copyright 2026 Daniel Klessa
directories:
  output: release
  buildResources: build

# The two bundles contain everything except Electron itself: no node_modules in the package.
files:
  - out/**
  - build/tray.png
  - build/tray-alert.png
  - build/badge-*.png
  - build/icon.png   # notifications on Linux (main/index.ts showNotification)
  - package.json
  - "!node_modules"
npmRebuild: false
asar: true

# Code signing (docs/features/desktop.md "Code signing", 4 October 2026): build/sign.cjs (win.signtoolOptions.sign below) hands
# every Windows executable to ssign, the client for Certum's SimplySign cloud, when CERTUM_EMAIL and CERTUM_OTP are set (the
# release workflow's `signing` environment); a `dist` without them stays unsigned, a release with SQUORLI_SIGN_REQUIRED=1
# fails unsigned. electron-builder brings every executable there itself: the native helpers while it copies the extra
# resources, Squorli.exe, elevate.exe, the uninstaller and the installer (6 signatures per build).

extraResources:
  - from: ../web/dist
    to: renderer
    filter:
      - "**/*"
      - "!**/*.map"
  - from: ../../LICENSE
    to: LICENSE.txt
  - from: ../../NOTICE
    to: NOTICE.txt
  - from: ../../THIRD-PARTY-NOTICES.md
    to: THIRD-PARTY-NOTICES.md

# `squorli://server/<host>` and `squorli://invite/<host>/<code>` open the app (handled from P5 on).
protocols:
  - name: Squorli
    schemes: [squorli]

# Artifact names without spaces: the update feed points at GitHub Releases, which rewrites spaces, and the differential
# update derives the old file's address from the new one.
win:
  target:
    - target: nsis
      arch: [x64]
  # The native helpers: audio capture and system watch (apps/desktop/native, built by `pnpm --filter @squorli/desktop native` before packaging).
  extraResources:
    - from: native/bin/win32-x64
      to: native
      filter: ["*.exe"]
  signtoolOptions:
    sign: ./build/sign.cjs
    signingHashAlgorithms: [sha256]   # one pass per file: ssign makes no dual (sha1 + sha256) signatures
    # electron-updater checks the downloaded installer's signature against `publisherName` (written into app-update.yml) before
    # it installs; without the name it installs unchecked. The name must equal the certificate's subject, forever: a version
    # shipped with a wrong name refuses every later update. The value is the subject as `Get-AuthenticodeSignature` prints it,
    # read from the first signed test build (4 October 2026); a renewed certificate with another subject = add it here, never
    # replace (electron-updater accepts any name of the list). Since electron-builder 26 the option lives here, not under
    # `win` directly (the schema check of the first tag build failed on that). Details: docs/features/desktop.md "Code signing".
    publisherName:
      - "CN=Open Source Developer Daniel Klessa, O=Open Source Developer, S=Niedersachsen, C=DE"
  verifyUpdateCodeSignature: true
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: false
  deleteAppDataOnUninstall: false
  artifactName: Squorli-Setup-${version}.${ext}
  uninstallDisplayName: Squorli

linux:
  target: [AppImage, deb]
  category: Network
  synopsis: Self-hosted community chat with voice and video
  # A deb package must name a maintainer; the address is public with the package (user's decision, 18 September 2026).
  maintainer: Daniel Klessa <desktop@squorli.com>
  executableName: squorli
  artifactName: Squorli-${version}-${arch}.${ext}

# macOS (21 October 2026, docs/features/desktop.md "macOS build"): two DMGs, Apple Silicon (arm64) and Intel (x64), built on
# the macos-latest runner (arm64; electron-builder downloads the x64 Electron for the second). No Apple Developer account (the
# user's decision, 21 October 2026): the app carries an AD-HOC signature (`identity: "-"`; `null` would skip signing, and an
# Apple Silicon Mac does not start an app whose signature is missing or broken), which Gatekeeper treats as unsigned (the
# download page says how to open it). electron-builder flips the fuses above and signs afterwards, so
# `electronFuses.resetAdHocDarwinSignature` is not needed. No hardened runtime (its library validation would refuse the ad-hoc
# frameworks), no notarization. electron-updater cannot install on macOS without a Developer ID (Squirrel.Mac), so the app only
# shows the notice (updateMode.ts "manual"); the dmg still contributes to `latest-mac.yml` for that check (no zip target: it
# would double the upload for an update path that cannot work yet). A signed build later = CSC_LINK/CSC_KEY_PASSWORD,
# hardenedRuntime with entitlements, notarize, the zip target, updateMode "self".
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.social-networking
  icon: build/icon.png   # electron-builder derives the .icns, as it derives the .ico
  artifactName: Squorli-${version}-${arch}.${ext}
  identity: "-"
  hardenedRuntime: false
  gatekeeperAssess: false
  notarize: false
  darkModeSupport: true
  # Without these texts macOS ends the app the moment the client asks for the microphone or the camera.
  extendInfo:
    NSMicrophoneUsageDescription: Squorli uses the microphone for voice channels.
    NSCameraUsageDescription: Squorli uses the camera for video in voice channels.
dmg:
  artifactName: Squorli-${version}-${arch}.${ext}
  sign: false
  contents:
    - { x: 130, y: 220 }
    - { x: 410, y: 220, type: link, path: /Applications }

# The app asks only squorli.com for updates; the feed there points at the GitHub Releases files (squorli-website).
publish:
  - provider: generic
    url: https://squorli.com/updates/stable

electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableCookieEncryption: true
  onlyLoadAppFromAsar: true
